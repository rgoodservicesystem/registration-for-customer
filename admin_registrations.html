<head>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6fbff;--card:#fff;--mut:#64748b;--border:#e6eef5;--accent:#0ea5a5;--accent2:#60a5fa}
  body{font-family:"Prompt",sans-serif;background:var(--bg);margin:0;color:#0f172a}
  header{padding:16px;background:linear-gradient(180deg,#f0fbff,#eaf7ff);border-bottom:1px solid var(--border)}
  .wrap{max-width:1200px;margin:18px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 8px 28px rgba(10,30,60,.06)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,select,button,textarea{padding:10px;border-radius:10px;border:1px solid var(--border);font-size:14px;background:#fff}
  .btn{cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-weight:700}
  .btn-ghost{background:#fff;border:1px solid #d6eef3;color:#0b6b6b}
  .small{font-size:13px;color:var(--mut)}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{background:linear-gradient(180deg,#f7fbff,#f2f8ff);position:sticky;top:0;z-index:1}
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:9999}
  .modal-box{background:#fff;padding:16px;border-radius:12px;width:820px;max-width:96%}
  td.editable{cursor:text}
  td.editing{background:#fffbe6}
  .badge{padding:6px 8px;border-radius:999px;font-weight:600;font-size:13px}
  .ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d090}
  .warn{background:#fff7ed;color:#b45309;border:1px solid #fde68a80}
  .exp{background:#fff1f2;color:#b91c1c;border:1px solid #fecaca90}
/* --- ส่วนไฮไลท์เมื่อเอาเมาส์ชี้ (Hover Effect) --- */
  tbody tr {
    transition: background-color 0.15s ease; /* ให้สีค่อยๆ เปลี่ยน นุ่มนวล */
  }
  tbody tr:hover {
    background-color: #e0f2fe; /* เปลี่ยนสีพื้นหลังเป็นสีฟ้าอ่อน */
    cursor: pointer;           /* เปลี่ยนเมาส์เป็นรูปนิ้วมือ */
  }
  
  /* เพิ่มให้: ถ้ากำลังแก้ไข (editing) ไม่ต้องเปลี่ยนสี */
  tbody tr:hover td.editing {
    background-color: #fffbe6;
    cursor: text;
  }
  /* --- สีตามสถานะงาน (Status Colors) --- */
  
  /* ถ้าสถานะ: ดำเนินการแล้ว -> สีเขียวมินต์ */
  tr.st-done { background-color: #d1fae5 !important; }
  
  /* ถ้าสถานะ: อยู่ระหว่างดำเนินการ -> สีส้มอ่อน */
  tr.st-process { background-color: #ffedd5 !important; }

  /* ปรับสีตอน Hover ของพวกที่มีสถานะแล้ว ให้เข้มขึ้นนิดนึงจะได้รู้ว่าชี้อยู่ */
  tr.st-done:hover { background-color: #a7f3d0 !important; }
  tr.st-process:hover { background-color: #fed7aa !important; }
  /* --- เพิ่มสีสถานะ: เปลี่ยนแหล่งผลิตใหม่ (สีฟ้าสดใส) --- */
  tr.st-change { background-color: #cffafe !important; } 
  tr.st-change:hover { background-color: #a5f3fc !important; }
  /* --- ปรับขนาดป้ายและปุ่ม (เน้นอ่านง่าย สบายตา) --- */
  
  /* 1. ป้ายสถานะ (Badge) */
  .badge {
    font-size: 13px !important;    /* ขยายกลับมาขนาดปกติ อ่านชัด */
    padding: 4px 8px !important;   /* ขอบไม่หนาเกินไป */
    white-space: nowrap;           /* ข้อความยาวแถวเดียว */
    vertical-align: middle;
    border-radius: 6px;            /* มุมมนนิดๆ */
    font-weight: 600;              /* ตัวหนาพอประมาณ */
    border: 1px solid transparent; /* จองเส้นขอบ */
  }

  /* 2. สีชมพูสำหรับ "เปลี่ยนแหล่งผลิตใหม่" */
  .change {
    color: #9d174d !important;        
    background: #fce7f3 !important;   
    border: 1px solid #f472b6 !important; /* เส้นขอบสีชมพูชัดๆ */
  }

  /* 3. ปุ่มกดในตาราง (Admin) */
  .btn.small, .btn-ghost.small {
    font-size: 13px !important;    /* ขยายตัวหนังสือปุ่ม */
    padding: 4px 8px !important;   /* ขยายพื้นที่กดให้จิ้มง่ายขึ้น */
    height: auto;
  }

/* --- เพิ่มเติมสีสถานะให้ชัดเจน --- */

/* ถ้าสถานะ: ไม่ต่ออายุ -> สีเทาเข้มหม่นๆ หรือแดงจางๆ */
tr.st-cancel { 
    background-color: #fee2e2 !important; /* สีแดงอ่อนมาก */
    color: #991b1b; 
}
tr.st-cancel:hover { background-color: #fecaca !important; }

/* ถ้าสถานะ: เปลี่ยนแหล่งผลิตใหม่ -> สีฟ้าสดใส */
tr.st-change { background-color: #cffafe !important; } 
tr.st-change:hover { background-color: #a5f3fc !important; }

/* ตกแต่งให้แถวที่ "ดำเนินการแล้ว" ดูเด่นด้วยสีเขียว */
tr.st-done { background-color: #dcfce7 !important; color: #166534; }
tr.st-done:hover { background-color: #bbf7d0 !important; }

/* ตกแต่งให้แถวที่ "อยู่ระหว่างดำเนินการ" เป็นสีส้ม */
tr.st-process { background-color: #ffedd5 !important; color: #9a3412; }
tr.st-process:hover { background-color: #fed7aa !important; }
.btn-status-active {
    box-shadow: 0 0 0 2px var(--accent);
    transform: scale(1.1);
}
</style>
</head>

<script type="module">
// --- แก้ไข: ใช้ลิงก์ esm.sh เพื่อความเสถียร ---
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ================= CONFIG (แก้ถ้าจำเป็น) =================
const SUPABASE_URL = 'https://jlrogimfjmtwdqiuyejj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impscm9naW1mam10d2RxaXV5ZWpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk5NDIyODUsImV4cCI6MjA3NTUxODI4NX0.OvX7qgcIF5aCcLebUEUR_6D2KTUP2pALCjRtHWJ5qZg';
const LEGACY_ADMIN_KEY = 'PPHASIN2556'; // ถ้าใช้

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// tables
const COMPANIES_TABLE = 'companies';
const REG_TABLE = 'product_registrations';

// =============== Helpers ===============
const $ = id => document.getElementById(id);
// แจ้งเตือนล่วงหน้า 3 ปี
const WARNING_DAYS = 365 * 3; // = 1095 วัน
let currentCompany = '';
let cachedRows = [];
let filteredRows = [];
const selectedIds = new Set();
let editingNoteId = null;

function esc(s){ return String(s||'').replace(/[&<>'"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\' : '&#39;', '"':'&quot;'}[m]) ); }
function fmtDateBE(d){ 
    if(!d) return ''; 
    const t = new Date(d); 
    t.setHours(12, 0, 0, 0); // ป้องกันวันที่เคลื่อน
    if(isNaN(t)) return ''; 
    try { 
        return t.toLocaleDateString('th-TH-u-ca-buddhist',{year:'numeric',month:'short',day:'numeric', timeZone:'Asia/Bangkok'}); 
    } catch(e) { 
        return t.toISOString().split('T')[0];
    } 
}
function toISO(d){ if(!d) return ''; const t=new Date(d); return isNaN(t)?'':t.toISOString().slice(0,10); }
function toast(m, ok=true){ $('msg').textContent = m; $('msg').style.color = ok ? '#065f46' : '#b91c1c'; setTimeout(()=>{$('msg').textContent='';}, 3500); }

// =============== Load companies ===============
async function loadCompanies(){
  const sel = $('companySelect');
  sel.innerHTML = `<option value="">— กำลังโหลดบริษัท —</option>`;
  try{
    const { data, error } = await sb.from(COMPANIES_TABLE).select('code,name').order('code',{ascending:true});
    if(error) throw error;
    const rows = data || [];
    sel.innerHTML = `<option value="">— เลือกบริษัท —</option>` + rows.map(c=>`<option value="${esc(c.code)}">${esc(c.code)}${c.name? ' - '+esc(c.name):''}</option>`).join('');
  }catch(e){ console.error(e); sel.innerHTML = `<option value="">โหลดบริษัทไม่สำเร็จ</option>`; }
}

// =============== Load registrations ===============
async function loadDocs(code) {
    currentCompany = code;
    selectedIds.clear();
    $('cust_code').value = '';
    if (!code) { /* ...เดิม... */ return; }

    try {
        const { data, error } = await sb.from(REG_TABLE)
            .select('*')
            .eq('company_code', code);
            // เอา .order() ใน Supabase ออก แล้วมาเรียงใน JS จะยืดหยุ่นกว่า

        if (error) throw error;

        // --- เพิ่มการเรียงลำดับตรงนี้ ---
        cachedRows = (data || []).map(r => ({ ...r, ...classify(r.expiry_date, r.renewed_status) }));

        cachedRows.sort((a, b) => {
            // 1. ให้รายการที่ไม่มีวันหมดอายุไปอยู่ล่างสุด
            if (!a.expiry_date) return 1;
            if (!b.expiry_date) return -1;
            
            // 2. เรียงจากวันที่น้อยไปมาก (เก่าไปใหม่ / หมดอายุเร็วสุดขึ้นก่อน)
            return new Date(a.expiry_date) - new Date(b.expiry_date);
        });

        filteredRows = [...cachedRows];
        renderTable();
        
        // ...ส่วนโหลด plain_code เดิม...
    } catch (e) { /* ... */ }
}
// ================= ฟังก์ชันคำนวณวันหมดอายุแบบ ปี/เดือน/วัน =================
function classify(expiry, renewedStatus) {
    // 1. ถ้ามีสถานะพิเศษ (เช่น กำลังต่ออายุ, ดำเนินการแล้ว) ให้ข้ามการเช็กวันหมดอายุแบบปกติ
    if (renewedStatus && renewedStatus !== '') {
        // คืนค่าเป็น 'ปกติ' หรือตามสถานะ เพื่อไม่ให้ Badge กลายเป็นสีแดง (Expired)
        return { cls: 'status-active', badge: `<span class="badge ok">รันระบบอยู่</span>`, order: 3, statusText: renewedStatus };
    }

    if (!expiry) return { cls: '', badge: `<span class="badge ok">ปกติ</span>`, order: 3, statusText: 'ปกติ' };

    const now = new Date();
    const eff = new Date(expiry);
    now.setHours(0, 0, 0, 0);
    eff.setHours(0, 0, 0, 0);

    if (isNaN(eff)) return { cls: '', badge: `<span class="badge ok">ปกติ</span>`, order: 3, statusText: 'ปกติ' };

    const diffTime = eff.getTime() - now.getTime();
    const totalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    // กรณีหมดอายุแล้ว และ "ไม่ได้ทำเรื่องต่ออายุ"
    if (totalDays < 0) {
        return { cls: 'expired', badge: `<span class="badge exp">หมดอายุ</span>`, order: 1, statusText: 'หมดอายุ' };
    }

    // --- คำนวณแยก ปี-เดือน-วัน ---
    let years = eff.getFullYear() - now.getFullYear();
    let months = eff.getMonth() - now.getMonth();
    let days = eff.getDate() - now.getDate();

    // ปรับทดเลข: ถ้าวันติดลบ ให้ไปยืมเดือนก่อนหน้า
    if (days < 0) {
        months--;
        // หาวันสุดท้ายของเดือนก่อนหน้า เพื่อนำมาบวก
        const prevMonthLastDay = new Date(eff.getFullYear(), eff.getMonth(), 0).getDate();
        days += prevMonthLastDay;
    }
    // ปรับทดเลข: ถ้าเดือนติดลบ ให้ไปยืมปี
    if (months < 0) {
        years--;
        months += 12;
    }

    // สร้างข้อความที่จะแสดง (Label)
    let label = '';
    if (years > 0) {
        // กรณีเหลือเกิน 1 ปี: แสดง "เหลือ 1 ปี 2 เดือน"
        label = `เหลือ ${years} ปี ${months} เดือน`;
    } else if (months > 0) {
        // กรณีเหลือไม่ถึงปี แต่เกินเดือน: แสดง "เหลือ 5 เดือน 10 วัน"
        label = `เหลือ ${months} เดือน ${days} วัน`;
    } else {
        // กรณีเหลือน้อยกว่า 1 เดือน: แสดง "เหลือ 15 วัน"
        label = `เหลือ ${days} วัน`;
    }

    // 2. กรณีอยู่ในระยะแจ้งเตือน (WARNING_DAYS = 730 วัน หรือ 2 ปี)
    if (totalDays <= WARNING_DAYS) {
    return { cls: 'warning', badge: `<span class="badge warn">${label}</span>`, order: 2, statusText: label };
}

    // 3. กรณีปกติ (อายุยังเหลือเยอะกว่า 2 ปี)
    return { cls: '', badge: `<span class="badge ok">ปกติ</span>`, order: 2, statusText: 'ปกติ' };
}

function applyFilter(){
  const q = ($('adminSearch').value||'').trim().toLowerCase();
  const selectedYear = $('yearFilter').value; // 🟢 ดึงปีที่เลือกจากหน้าจอ

  const toks = q.split(/\s+/).filter(Boolean);
  
  filteredRows = cachedRows.filter(r => {
    // 1. กรองตามคำค้นหา (เหมือนเดิม)
    const hay = [r.brand_name, r.common_label, r.registration_no, r.importer, r.manufacturer_source, r.distributor, r.packed_volume].join(' ').toLowerCase();
    const matchesSearch = toks.every(t => hay.includes(t));

    // 2. 🟢 กรองตามปีทะเบียน (registration_date)
    let matchesYear = true;
    if (selectedYear !== 'all' && r.registration_date) {
      const regDate = new Date(r.registration_date);
      matchesYear = regDate.getFullYear().toString() === selectedYear;
    } else if (selectedYear !== 'all' && !r.registration_date) {
      matchesYear = false; // ถ้าเลือกปีแต่ข้อมูลไม่มีวันออกทะเบียน ให้ไม่แสดง
    }

    return matchesSearch && matchesYear;
  });
  
  renderTable();
}

(function initInlineEdit(){
  const tb = $('tbody');
  tb.addEventListener('dblclick', (e)=>{
    const td = e.target.closest('td.editable');
    if(!td) return;
    if(td.classList.contains('editing')) return;
    td.classList.add('editing');
    const id = td.dataset.id;
    const field = td.dataset.field;
    const old = td.getAttribute('data-raw') || td.textContent.trim();
    const input = document.createElement('input');
    input.style.width = '100%';
    if(field.includes('date')){ input.type='date'; input.value = td.getAttribute('data-raw') || ''; }
    else input.value = td.textContent.trim();
    td.innerHTML = ''; td.appendChild(input); input.focus();
    const finish = async (commit)=>{
      td.classList.remove('editing');
      if(!commit){ td.innerHTML = field.includes('date') ? (td.getAttribute('data-raw')?fmtDateBE(td.getAttribute('data-raw')):'') : esc(old); return; }
      const payload = {}; payload[field] = field.includes('date') ? (input.value||null) : (input.value.trim()||null);
      try{
        const { error } = await sb.from(REG_TABLE).update(payload).eq('id', id);
        if(error) throw error;
        loadDocs(currentCompany);
      }catch(e){ alert('บันทึกไม่สำเร็จ: '+(e.message||e)); td.innerHTML = esc(old); }
    };
    input.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); finish(true);} if(ev.key==='Escape'){ finish(false); }});
    input.addEventListener('blur', ()=> finish(true));
  });
})();

// ================= 1. แก้ไขฟังก์ชัน normalizeDate ให้รองรับ Date Object ดีขึ้น =================
function normalizeDate(v) {
    if (!v && v !== 0) return null;
    
    // กรณี SheetJS ส่งมาเป็น Date Object
    if (v instanceof Date && !isNaN(v)) {
        v.setHours(12, 0, 0, 0); // ล็อคเวลาไว้ที่เที่ยงวันป้องกันวันเคลื่อน
        return v.toISOString().slice(0, 10);
    }

    // กรณีมาเป็นตัวเลข (Excel Serial Date)
    if (typeof v === 'number' && isFinite(v)) {
        const epoch = new Date(Math.round((v - 25569) * 86400 * 1000));
        epoch.setHours(12, 0, 0, 0); // ป้องกันวันเคลื่อน
        return epoch.toISOString().slice(0, 10);
    }

    // กรณีมาเป็น Text String (dd/mm/yyyy หรือ yyyy-mm-dd)
    if (typeof v === 'string') {
        let s = v.trim().replace(/\./g, '/').replace(/\s+/g, '');
        const thnums = { '๐': '0', '๑': '1', '๒': '2', '๓': '3', '๔': '4', '๕': '5', '๖': '6', '๗': '7', '๘': '8', '๙': '9' };
        s = s.replace(/[๐-๙]/g, ch => thnums[ch] ?? ch);

        let m = s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;

        m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
        if (m) {
            let d = parseInt(m[1], 10), mo = parseInt(m[2], 10), y = parseInt(m[3], 10);
            if (y < 100) y += (y >= 70 ? 1900 : 2000);
            if (y > 2400) y -= 543; // พ.ศ. -> ค.ศ.
            return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        }
    }
    return null;
}
// ================= ฟังก์ชัน pick (ต้องมีตัวนี้ถึงจะ Import ได้) =================
function pick(obj, keys) {
    if (!obj || typeof obj !== 'object') return '';
    // วนลูปหา key ที่ตรงกัน (ไม่สนตัวพิมพ์เล็ก/ใหญ่)
    for (const k of keys) {
        const searchKey = k.toLowerCase().trim();
        for (const rawKey in obj) {
            if (rawKey.toLowerCase().trim() === searchKey) {
                return obj[rawKey];
            }
        }
    }
    return '';
}

                registration_date: registration_date || null,
                expiry_date: expiry_date || null,
                
                // 2. แก้ตรงนี้: ส่งข้อมูลไปที่ renewed_note แทน license_no
                renewed_note: String(note || '').trim() || null
                
                // (ลบ license_no ทิ้งไปเลยครับ)
            };
        }).filter(x => x.brand_name && x.common_label);

        console.log('Mapped Data to Insert:', mapped); // ดูข้อมูลที่จะส่งไป Supabase ใน Console

        if (mapped.length === 0) {
            return alert('❌ ไม่พบข้อมูลที่ถูกต้อง! \nกรุณาตรวจสอบหัวตารางใน Excel ว่าตรงกับคำว่า: "ชื่อการค้า", "ชื่อสามัญ/สูตร" หรือไม่');
        }

        // ลบข้อมูลเก่าถ้าเลือก Replace
        if ($('replaceMode').checked) {
            const del = await sb.from(REG_TABLE).delete().eq('company_code', currentCompany);
            if (del.error) throw new Error('ลบข้อมูลเก่าไม่สำเร็จ: ' + del.error.message);
        }

        // ทยอย Insert ทีละ 500 แถว
        let successCount = 0;
        for (let i = 0; i < mapped.length; i += 500) {
            const chunk = mapped.slice(i, i + 500);
            const { error } = await sb.from(REG_TABLE).insert(chunk);
            if (error) {
                console.error('Insert Error Chunk ' + i, error);
                throw new Error('บันทึกข้อมูลไม่สำเร็จ: ' + error.message + ' (Check Console)');
            }
            successCount += chunk.length;
        }

        toast(`✅ นำเข้าสำเร็จ ${successCount} รายการ`);
        loadDocs(currentCompany); // รีโหลดตาราง
        $('fileInput').value = ''; // เคลียร์ไฟล์

    } catch (err) {
        console.error('FULL IMPORT ERROR:', err);
        alert('❌ เกิดข้อผิดพลาด: ' + (err.message || err));
    }
});
// export xlsx
$('expBtn').addEventListener('click', async () => {
  if (!currentCompany) return alert('เลือกบริษัทก่อนส่งออก');
  try {
    const rows = filteredRows || []; // ใช้ filteredRows เพื่อให้โหลดตามที่เราคัดกรองหน้าจอไว้
    
    // 1. หัวตาราง
    const aoa = [['บริษัท', 'ชื่อการค้า', 'ชื่อสามัญ/สูตร', 'ทะเบียน', 'ผู้นำเข้า', 'ผู้ผลิต/แหล่งผลิต', 'ผู้จำหน่าย', 'นำเข้า/แบ่งบรรจุ', 'วันออกทะเบียน', 'วันหมดอายุ', 'หมายเหตุ', 'สถานะ']];

    // 2. จัดการแปลงข้อมูลแต่ละแถว
    rows.forEach(r => {
      // แปลงวันที่เป็น พ.ศ. โดยใช้ฟังก์ชัน fmtDateBE ที่คุณมีอยู่แล้วในโค้ด
      const regDateTH = r.registration_date ? fmtDateBE(r.registration_date) : '';
      const expDateTH = r.expiry_date ? fmtDateBE(r.expiry_date) : '';

      aoa.push([
        r.company_code || '',
        r.brand_name || '',
        r.common_label || '',
        r.registration_no || '',
        r.importer || '',
        r.manufacturer_source || '',
        r.distributor || '',
        r.packed_volume || '',
        regDateTH,  // ใส่ค่า พ.ศ. ที่แปลงแล้ว
        expDateTH,  // ใส่ค่า พ.ศ. ที่แปลงแล้ว
        r.renewed_note || '',
        r.statusText || r.renewed_status || ''
      ]);
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, currentCompany.slice(0, 31));
    
    // ตั้งชื่อไฟล์ให้มีรหัสบริษัทและวันที่ปัจจุบัน
    const fileName = `registrations_${currentCompany}_${new Date().toLocaleDateString('th-TH').replace(/\//g, '-')}.xlsx`;
    XLSX.writeFile(wb, fileName);
    
    toast("✅ ส่งออกไฟล์ (พ.ศ.) เรียบร้อย");
  } catch (e) {
    console.error(e);
    alert('ส่งออกไม่สำเร็จ: ' + (e.message || e));
  }
});

// แนะนำให้เหลือแค่อันนี้อันเดียวครับ
$('filterActiveBtn').onclick = () => {
    const today = new Date();
    today.setHours(0,0,0,0);
    filteredRows = cachedRows.filter(r => {
        const isNoRenew = r.renewed_status === 'ไม่ต่ออายุ';
        const isExpired = r.expiry_date && new Date(r.expiry_date) < today;
        const isWorking = r.renewed_status === 'อยู่ระหว่างดำเนินการ' || r.renewed_status === 'ดำเนินการแล้ว';
        return !isNoRenew && (!isExpired || isWorking);
    });
    renderTable();
};
let asc = true;
window.sortByDate = () => {
    filteredRows.sort((a, b) => {
        const d1 = new Date(a.expiry_date || '9999-12-31');
        const d2 = new Date(b.expiry_date || '9999-12-31');
        return asc ? d1 - d2 : d2 - d1;
    });
    asc = !asc;
    renderTable();
};
